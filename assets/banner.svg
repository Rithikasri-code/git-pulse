<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 240" width="100%" height="240">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a101d" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#070c16" />
    </linearGradient>
    <linearGradient id="pulseNeon" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#10b981" flood-opacity="0.35" />
    </filter>
  </defs>

  <style>
    .mono { font-family: 'JetBrains Mono', 'Fira Code', Consolas, monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
  </style>

  <!-- Border & Frame -->
  <rect x="2" y="2" width="896" height="236" rx="12" fill="url(#bg)" stroke="#1e293b" stroke-width="2" />
  <rect x="8" y="8" width="884" height="224" rx="8" fill="none" stroke="#10b981" stroke-width="1" stroke-dasharray="4 4" stroke-opacity="0.25" />

  <!-- Git Pulse Waveform on Left -->
  <g transform="translate(60, 115)" stroke="url(#pulseNeon)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M 0 0 L 40 0 L 55 -25 L 70 30 L 85 -35 L 100 20 L 115 -10 L 130 0 L 170 0" />
    <circle cx="85" cy="-35" r="4" fill="#10b981" />
  </g>

  <!-- Git Branch Tree on Right -->
  <g transform="translate(710, 80)" stroke="#38bdf8" stroke-width="2" fill="none">
    <!-- Main branch line -->
    <line x1="20" y1="20" x2="140" y2="20" stroke="#10b981" stroke-width="3" />
    <!-- Feature branch line -->
    <path d="M 40 20 C 60 20 60 60 80 60 L 140 60" />
    <!-- Nodes -->
    <circle cx="20" cy="20" r="5" fill="#10b981" stroke="#0f172a" stroke-width="2" />
    <circle cx="80" cy="20" r="5" fill="#10b981" stroke="#0f172a" stroke-width="2" />
    <circle cx="140" cy="20" r="5" fill="#10b981" stroke="#0f172a" stroke-width="2" />
    <circle cx="95" cy="60" r="5" fill="#38bdf8" stroke="#0f172a" stroke-width="2" />
    <circle cx="140" cy="60" r="5" fill="#38bdf8" stroke="#0f172a" stroke-width="2" />
  </g>

  <!-- Corner Brackets -->
  <path d="M 16 32 L 16 16 L 32 16" fill="none" stroke="#10b981" stroke-width="2" />
  <path d="M 884 32 L 884 16 L 868 16" fill="none" stroke="#10b981" stroke-width="2" />
  <path d="M 16 208 L 16 224 L 32 224" fill="none" stroke="#10b981" stroke-width="2" />
  <path d="M 884 208 L 884 224 L 868 224" fill="none" stroke="#10b981" stroke-width="2" />

  <!-- Main Titles -->
  <text x="450" y="52" text-anchor="middle" fill="#10b981" class="mono" font-size="13" letter-spacing="2">&lt;DEVELOPER_OPS / REPO_PANEL&gt;</text>
  <text x="450" y="100" text-anchor="middle" fill="#f8fafc" class="sans" font-size="38" font-weight="800" letter-spacing="4" filter="url(#softGlow)">GIT PULSE</text>
  <text x="450" y="130" text-anchor="middle" fill="#94a3b8" class="sans" font-size="14" font-weight="500" letter-spacing="1.5">REAL-TIME MULTI-REPOSITORY COMMAND CENTER &amp; PR KANBAN</text>

  <!-- Divider -->
  <line x1="220" y1="146" x2="680" y2="146" stroke="#1e293b" stroke-width="1" />

  <!-- Pills -->
  <g transform="translate(145, 162)">
    <rect x="0" y="0" width="135" height="26" rx="6" fill="#0f172a" stroke="#10b981" stroke-width="1" stroke-opacity="0.6" />
    <text x="67" y="17" text-anchor="middle" fill="#d1fae5" class="mono" font-size="11">Zero Dependencies</text>

    <rect x="150" y="0" width="145" height="26" rx="6" fill="#0f172a" stroke="#06b6d4" stroke-width="1" stroke-opacity="0.6" />
    <text x="222" y="17" text-anchor="middle" fill="#cffafe" class="mono" font-size="11">Live SSE Streaming</text>

    <rect x="310" y="0" width="145" height="26" rx="6" fill="#0f172a" stroke="#3b82f6" stroke-width="1" stroke-opacity="0.6" />
    <text x="382" y="17" text-anchor="middle" fill="#dbeafe" class="mono" font-size="11">PR Kanban &amp; Merge</text>

    <rect x="470" y="0" width="135" height="26" rx="6" fill="#0f172a" stroke="#10b981" stroke-width="1" stroke-opacity="0.6" />
    <text x="537" y="17" text-anchor="middle" fill="#d1fae5" class="mono" font-size="11">Split Diff Viewer</text>
  </g>

  <text x="450" y="214" text-anchor="middle" fill="#64748b" class="mono" font-size="11">Automated Background Fetch • GitHub CLI Bridge • Multi-Repository Orchestration</text>
</svg>
